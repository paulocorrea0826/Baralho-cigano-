/* One and the same red-star deck: travel from her hand, then open toward the viewer. */
.screen.spread-screen{background-position:center 52%}
.screen.spread-screen .throw-frame{background-image:linear-gradient(180deg,rgba(14,7,11,.74) 0%,rgba(15,7,11,.23) 42%,rgba(15,7,11,.10) 65%,rgba(15,7,11,.32) 100%),var(--character-throw);background-position:center 52%;opacity:0;transition:opacity .34s ease}
.screen.spread-screen .release-frame{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background-image:linear-gradient(180deg,rgba(14,7,11,.74) 0%,rgba(15,7,11,.23) 42%,rgba(15,7,11,.10) 65%,rgba(15,7,11,.32) 100%),var(--character-release);background-size:cover;background-position:center 52%;transition:opacity .3s ease}
.screen.spread-screen.throwing .throw-frame{opacity:1}
.screen.spread-screen.released .throw-frame{opacity:0}
.screen.spread-screen.released .release-frame{opacity:1}
.screen.spread-screen>*:not(.throw-frame):not(.release-frame){position:relative;z-index:3}
.screen.spread-screen .fan-wrap{position:absolute;left:0;right:0;top:43%;height:35%;min-height:245px;margin:0;overflow:visible;z-index:2;flex:none;pointer-events:none}
.screen.spread-screen .fan-card{pointer-events:auto;top:4px;bottom:auto;left:calc(50% - 30px);width:60px;height:104px;border:1.5px solid #e6c46e;border-radius:7px;background:linear-gradient(150deg,#a52339 0%,#6a1025 62%,#3a0b19 100%);box-shadow:0 5px 14px #000b;transform-origin:50% 0%;transition:transform .58s cubic-bezier(.15,.75,.2,1),opacity .36s ease,filter .2s;transition-delay:var(--delay,0ms);opacity:0;z-index:var(--zi,1)}
.screen.spread-screen .fan-card:before{content:'';position:absolute;inset:4px;border:1px solid #e6c46ea8;border-radius:4px;display:block}
.screen.spread-screen .fan-card:after{content:'★';position:absolute;inset:0;display:grid;place-items:center;color:#f1d27c;font:20px Georgia,serif;text-shadow:0 1px 5px #31000a}
.screen.spread-screen .fan-wrap.closed .fan-card{transform:translateY(-135px) scale(.18) rotate(var(--angle,0deg));opacity:0}
.screen.spread-screen .fan-wrap.opening .fan-card{opacity:.92;transform:rotate(var(--angle,0deg)) translateY(0) scale(.98)}
.screen.spread-screen .fan-wrap.open .fan-card{opacity:1;transform:rotate(var(--angle,0deg)) translateY(0) scale(1)}
.screen.spread-screen .fan-hint{z-index:4;margin-top:auto;padding-top:0;pointer-events:none}
.screen.spread-screen .fan-note{z-index:4}
@media(max-height:700px){.screen.spread-screen .fan-wrap{top:39%;height:34%;min-height:205px}.screen.spread-screen .fan-card{width:53px;height:91px;left:calc(50% - 26.5px)}}

/* Sincroniza o gesto com o leque: as cartas nascem na mão e abrem para baixo, sobre a saia. */
.screen.spread-screen{background-position:center 52%}
.screen.spread-screen .fan-wrap{top:56%;height:31%;min-height:220px;pointer-events:none}
.screen.spread-screen .fan-card{top:0;transform-origin:50% 0%;transition-duration:.72s;transition-delay:var(--delay,0ms)}
.screen.spread-screen .fan-wrap.closed .fan-card{transform:rotate(0deg) translateY(-10px) scale(.26);opacity:0}
.screen.spread-screen .fan-wrap.opening .fan-card{opacity:.98;transform:rotate(var(--angle,0deg)) translateY(0) scale(1)}
.screen.spread-screen .fan-wrap.open .fan-card{opacity:1;transform:rotate(var(--angle,0deg)) translateY(0) scale(1)}
.screen.spread-screen.throwing .throw-frame{opacity:1;clip-path:inset(0 0 0 0);animation:handSweep .52s cubic-bezier(.2,.7,.25,1) both}
@keyframes handSweep{0%{clip-path:inset(0 100% 0 0);opacity:.25}15%{opacity:1}100%{clip-path:inset(0 0 0 0);opacity:1}}
.screen.spread-screen.released .throw-frame{opacity:0;animation:none}
.screen.spread-screen.released .release-frame{opacity:1}
@media(max-height:700px){.screen.spread-screen .fan-wrap{top:53%;height:32%;min-height:190px}.screen.spread-screen .fan-card{width:53px;height:91px;left:calc(50% - 26.5px)}}
/* Posição final: a carta nasce no nível da mão e o leque se espalha só pela saia. */
.screen.spread-screen .fan-wrap{top:61% !important;height:29% !important;min-height:190px !important;left:0 !important;right:0 !important;z-index:4 !important;overflow:visible !important}
.screen.spread-screen .fan-card{top:0 !important;transform-origin:50% 0% !important}
@media(max-height:700px){.screen.spread-screen .fan-wrap{top:59% !important;height:28% !important;min-height:170px !important}}
/* Fix final: use viewport coordinates, never percentage of expanding content. The spread anchor sits at her hand on the skirt. */
